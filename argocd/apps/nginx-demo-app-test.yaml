apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/h0perium/argocd-demo.git
    targetRevision: main
    path: k8s/nginx/overlays/test

  destination:
    server: https://kubernetes.default.svc
    namespace: test

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
