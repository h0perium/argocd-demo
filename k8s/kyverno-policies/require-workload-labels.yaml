apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-workload-labels
spec:
  emitWarning: true
  rules:
    - name: require-app-and-team-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
      validate:
        failureAction: Audit
        message: "Deployments must have non-empty app and team labels."
        pattern:
          metadata:
            labels:
              app: "?*"
              team: "?*"
